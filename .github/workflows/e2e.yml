name: e2e

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Run the end-to-end tests in Docker
        run: scripts/e2e.sh
      - name: Show the saved logs
        if: failure()
        run: |
          stop=$(openssl rand -hex 16)
          for file in $(find e2e/logs -type f | sort); do
            echo "::group::$file"
            echo "::stop-commands::$stop"
            cat "$file"
            echo "::$stop::"
            echo "::endgroup::"
          done
