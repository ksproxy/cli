
# Added for the e2e tests: every HTTP request that reaches the node, with its method and its path, in
# /eslog/requests.log (the logs folder of the node). The driver reads it to show which calls reached Elasticsearch.
appender.e2e_requests.type = File
appender.e2e_requests.name = e2e_requests
appender.e2e_requests.fileName = ${sys:es.logs.base_path}${sys:file.separator}requests.log
appender.e2e_requests.layout.type = PatternLayout
appender.e2e_requests.layout.pattern = [%d{ISO8601}] %m%n
logger.e2e_requests.name = org.elasticsearch.http.HttpTracer
logger.e2e_requests.level = trace
logger.e2e_requests.appenderRef.e2e_requests.ref = e2e_requests
logger.e2e_requests.additivity = false
