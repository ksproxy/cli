# The server of the run: TLS only, on port 6380, no client certificate. The users are in the ACL file that the
# service make-secrets wrote; it turns the default user off. The data is the seed that start.sh saved in /data.
port 0
tls-port 6380
tls-cert-file /secrets/server.crt
tls-key-file /secrets/server.key
tls-ca-cert-file /secrets/ca.crt
tls-auth-clients no
aclfile /secrets/users.acl
protected-mode no
dir /data
save ""
appendonly no
