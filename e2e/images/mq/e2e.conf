# The broker of the run. No AMQP listener: ksproxy speaks only the management API. That API listens with the
# certificate of the run on port 15671, and plainly on 127.0.0.1:15672 for the seed only. The users, permissions,
# queue, exchange and binding come from the definitions that the service make-secrets wrote. guest and e2e-seed may
# log in from this container only. Every request to the API is written to the access log in /mqlog, a volume that the
# runner reads.
log.console = true
listeners.tcp = none
loopback_users.guest = true
loopback_users.e2e-seed = true
load_definitions = /secrets/definitions.json
management.tcp.port = 15672
management.tcp.ip = 127.0.0.1
management.ssl.port = 15671
management.ssl.cacertfile = /secrets/ca.crt
management.ssl.certfile = /secrets/server.crt
management.ssl.keyfile = /secrets/server.key
management.http_log_dir = /mqlog
