# The settings of the e2e broker: one node that is both broker and controller (KRaft). start.sh adds the lines that
# hold the passwords of the run. Clients from the network use SASL_SSL on port 9093, as the examples' client files
# say; the broker itself and the seed use the user admin on the loopback listeners only.
process.roles=broker,controller
node.id=1
controller.quorum.voters=1@127.0.0.1:9094
listeners=SASL_SSL://0.0.0.0:9093,INTERNAL://127.0.0.1:9092,CONTROLLER://127.0.0.1:9094
advertised.listeners=SASL_SSL://kafka:9093,INTERNAL://127.0.0.1:9092
listener.security.protocol.map=SASL_SSL:SASL_SSL,INTERNAL:SASL_PLAINTEXT,CONTROLLER:SASL_PLAINTEXT
inter.broker.listener.name=INTERNAL
controller.listener.names=CONTROLLER
sasl.enabled.mechanisms=PLAIN
sasl.mechanism.inter.broker.protocol=PLAIN
sasl.mechanism.controller.protocol=PLAIN
ssl.keystore.type=PEM

# Every request is checked against the ACLs that start.sh sets; a resource without an ACL is refused.
authorizer.class.name=org.apache.kafka.metadata.authorizer.StandardAuthorizer
super.users=User:admin
allow.everyone.if.no.acl.found=false

log.dirs=/var/lib/kafka/data
auto.create.topics.enable=false
num.partitions=1
offsets.topic.replication.factor=1
offsets.topic.num.partitions=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
share.coordinator.state.topic.replication.factor=1
share.coordinator.state.topic.min.isr=1
group.initial.rebalance.delay.ms=0
